<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d1a">
<title>Arkania</title>
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;700;800&display=swap">
<style>
/* Layout: el mapa ocupa toda la pantalla; encima van una barra de estado fina, el combate y las ventanas. Un solo mundo visual, oscuro. */
:root{ --bg:#0b0d1a; --panel:#171b34; --panel2:#232a52; --ink:#f4f1e6; --muted:#a2abd0; --line:#3d4788;
  --gold:#ffcf4a; --hp:#ef5158; --xp:#4ac6ff; --ok:#5fd66b; --bad:#ef5158; --on-gold:#2a1e00;
  --display:"Segoe UI Emoji","Segoe UI","Lexend",system-ui,sans-serif; --num:"Segoe UI Emoji","Segoe UI","Lexend",system-ui,sans-serif; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:18px;line-height:1.3;overflow:hidden;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,p{margin:0}
.bar{height:14px;background:#0008;border:2px solid #000a;border-radius:4px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--hp);transition:width .25s}
.bar.xp{height:8px}.bar.xp i{background:var(--xp)}
.bar.time{height:12px}.bar.time i{background:var(--gold);transition:none}
.btn{font-weight:700;font-size:1.1rem;border:0;border-radius:999px;padding:.5em 1.1em;min-height:48px;background:var(--gold);color:var(--on-gold);box-shadow:0 4px 0 #a37a12}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a37a12}
.btn.alt{background:var(--panel2);color:var(--ink);box-shadow:0 4px 0 #0f1330}
.btn[disabled]{opacity:.4;cursor:default}

/* estado */
#hud{position:absolute;top:0;left:0;right:0;padding-top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:flex-start;pointer-events:none}
.stat{font-family:var(--num);background:#0b0d1acc;border:2px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;gap:4px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .r{display:flex;gap:8px;align-items:center;font-size:.95rem}
#obj{flex:1;min-width:0;text-align:center;font-weight:600;font-size:.95rem;background:#0b0d1acc;border:2px solid var(--line);border-radius:10px;padding:6px 10px;align-self:flex-start}
#menuBtn,#trainHud{pointer-events:auto;min-width:52px;min-height:52px;border-radius:10px;border:2px solid var(--line);background:#0b0d1acc;font-weight:700}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:inset -3px -3px 0 #a37a12}
.gems{display:flex;gap:5px}.gems i{width:11px;height:11px;transform:rotate(45deg);background:#0006;border:2px solid var(--line)}
.gems i.on{background:var(--c);border-color:#fff}
#dpad{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:3px;opacity:.75}
#dpad button{border:2px solid var(--line);border-radius:12px;background:#0b0d1acc;font-size:1.2rem}
#dpad button:active{background:var(--panel2)}
#dpad .u{grid-area:1/2}#dpad .l{grid-area:2/1}#dpad .r{grid-area:2/3}#dpad .d{grid-area:3/2}
#banner{position:absolute;left:0;right:0;top:26%;text-align:center;font-weight:700;font-size:clamp(1.6rem,6vw,3rem);text-shadow:0 4px 0 #000;pointer-events:none;opacity:0;transition:opacity .5s}
#banner.on{opacity:1}
#toast{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(90%,520px);background:#0b0d1aee;border:2px solid var(--gold);border-radius:10px;padding:8px 14px;font-weight:600;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s}
#toast.on{opacity:1}

/* portada */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 40%,#0b0d1a66,#0b0d1aee);text-align:center}
#title h1{font-size:clamp(3rem,13vw,7rem);font-weight:800;letter-spacing:.08em;line-height:1;color:var(--gold);text-shadow:0 6px 0 #7a4a00,0 12px 0 #000}
#title p{font-size:1.2rem;color:var(--ink);max-width:30ch;text-wrap:balance}

/* combate */
#battle{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.btop{display:flex;justify-content:space-between;gap:12px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.who{font-family:var(--num);background:#0b0d1acc;border:2px solid var(--line);border-radius:10px;padding:6px 10px;min-width:min(42%,260px);display:flex;flex-direction:column;gap:4px;font-weight:700}
.who .r{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.bpanel{pointer-events:auto;background:var(--panel);border-top:4px solid var(--line);padding-top:10px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
#bq{font-family:var(--num);font-weight:800;letter-spacing:.02em;font-size:clamp(1.9rem,6.5vw,3rem);text-align:center;line-height:1.05;font-variant-numeric:tabular-nums;text-wrap:balance}
#bq.sm{font-size:clamp(1.3rem,4.5vw,2rem)}
#bq .hole,.cq .hole{display:inline-block;min-width:1.3em;background:var(--gold);color:var(--on-gold);border-radius:6px;padding:0 .15em}
#bhint{font-family:var(--num);min-height:1.4em;text-align:center;font-weight:600;color:var(--gold);font-size:1.05rem}
.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.answers{grid-template-columns:repeat(2,1fr)}}
.answers button{font-family:var(--num);font-weight:800;letter-spacing:.03em;font-size:clamp(1.5rem,5vw,2.3rem);min-height:64px;border-radius:18px;border:3px solid #7f9dff;background:linear-gradient(#3f6fe0,#2a4bb0);box-shadow:0 5px 0 #1a2f78;font-variant-numeric:tabular-nums}
.answers button:active{transform:translateY(2px)}
.answers button.no{opacity:.3;pointer-events:none;border-color:var(--bad)}
.answers button.yes{border-color:var(--ok);background:#1d5a2a}
.answers button.show{border-color:var(--gold);animation:glow .6s infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 5px #ffcf4a66}}
.brow{display:flex;justify-content:center;gap:10px}
#flee{background:none;border:0;color:var(--muted);text-decoration:underline;font-weight:600;min-height:40px}

/* ventanas */
#modal{position:absolute;inset:0;background:#05060ecc;display:flex;align-items:center;justify-content:center;padding-block:16px}
.win{background:var(--panel);border:4px solid var(--line);border-radius:14px;width:min(100%,640px);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.win header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--panel2)}
.win header h2{font-size:1.4rem}
.win .x{width:44px;height:44px;border-radius:8px;border:0;background:#0006;font-weight:700}
.wbody{padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;touch-action:pan-y}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:2px solid var(--line);background:none;border-radius:8px;padding:.3em .8em;font-weight:700;min-height:44px}
.tabs button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.item{display:flex;align-items:center;gap:12px;background:var(--panel2);border-radius:10px;padding:8px 12px}
.item canvas{width:48px;height:48px;flex:none}
.item .t{flex:1;min-width:0}.item .t small{display:block;color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.mon{background:var(--panel2);border-radius:10px;padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.mon canvas{width:64px;height:64px}
.mon small{color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kv div{background:var(--panel2);border-radius:10px;padding:8px 10px}.kv b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.looks{display:flex;gap:8px;flex-wrap:wrap}
.looks button{border:3px solid transparent;border-radius:10px;background:var(--panel2);padding:4px}
.looks button[aria-pressed="true"]{border-color:var(--gold)}
.looks canvas{width:56px;height:56px;display:block}
.locks{display:flex;gap:8px;justify-content:center;font-size:1.6rem}
.cq{font-family:var(--num);font-weight:800;font-size:clamp(1.4rem,5vw,2.2rem);text-align:center;text-wrap:balance}
.scroll{overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:3px;font-size:.85rem;font-variant-numeric:tabular-nums;font-family:system-ui,sans-serif}
.heat th{color:var(--muted);padding:2px 6px}.heat td{width:44px;height:30px;text-align:center;border-radius:5px;background:#0006;color:var(--muted);font-weight:700}
.heat .h1{background:var(--bad);color:#fff}.heat .h2{background:var(--gold);color:var(--on-gold)}.heat .h3{background:#2f9e44;color:#fff}
.heat .h1::after{content:" !"}.heat .h3::after{content:" ✓"}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <canvas id="cv" role="img" aria-label="Mapa de Arkania"></canvas>
  <div id="hud" class="gut" hidden>
    <div class="stat">
      <div class="r"><span>Nv <span id="hLvl">1</span></span><div class="bar"><i id="hHpBar"></i></div><span id="hHpTxt"></span></div>
      <div class="r"><div class="bar xp" style="flex:1"><i id="hXpBar"></i></div></div>
      <div class="r"><span class="coin"></span><span id="hCoins">0</span><span class="gems" id="hGems" aria-label="Cristales"></span></div>
    </div>
    <div id="obj"></div>
    <button id="trainHud">Entrenar</button>
    <button id="menuBtn">Mochila</button>
  </div>
  <div id="dpad" hidden role="group" aria-label="Mover al héroe">
    <button class="u" data-d="0" aria-label="Arriba">▲</button><button class="l" data-d="3" aria-label="Izquierda">◀</button>
    <button class="r" data-d="1" aria-label="Derecha">▶</button><button class="d" data-d="2" aria-label="Abajo">▼</button>
  </div>
  <div id="banner"></div>
  <div id="toast" aria-live="polite"></div>

  <section id="title" class="gut">
    <h1>ARKANIA</h1>
    <p>Eres aprendiz de ninja. Cuatro guardianes han robado los Cristales del Saber.</p>
    <div class="brow" style="flex-wrap:wrap"><button class="btn" id="playBtn">Aventura</button><button class="btn alt" id="trainBtn">Entrenamiento</button></div>
  </section>

  <section id="battle" hidden>
    <div class="btop gut">
      <div class="who"><div class="r"><span>Tú · Nv <span id="bLvl"></span></span><span id="bHpTxt"></span></div><div class="bar"><i id="bHp"></i></div></div>
      <div class="who"><div class="r"><span id="eName"></span><span id="eHpTxt"></span></div><div class="bar"><i id="eHp"></i></div></div>
    </div>
    <div class="bpanel gut" id="bpanel">
      <div class="bar time" id="tWrap"><i id="tBar"></i></div>
      <div id="bq" aria-live="polite"></div>
      <div id="bhint"></div>
      <div class="answers" id="answers"></div>
      <div class="brow"><button class="btn" id="bCont" hidden>Continuar</button><button id="flee">Huir del combate</button></div>
    </div>
  </section>

  <section id="modal" class="gut" hidden><div class="win"><header><h2 id="mTitle"></h2><button class="x" id="mClose" aria-label="Cerrar">✕</button></header><div class="wbody" id="mBody"></div></div></section>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id), rnd=n=>Math.floor(Math.random()*n), pick=a=>a[rnd(a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
function seeded(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ================= dibujos ================= */
const K='#15172b', TAU=6.2832, RES=192;
const BASE={k:K,w:'#ffffff',e:K,y:'#ffcf4a',n:'#8a5a34',r:'#e5484d'};
const pal=(a,b,c,x)=>Object.assign({},BASE,{a,b,c},x||{});
const P3=(a,b,c)=>({a,b,c});
function lt(h,f){const n=parseInt(h.slice(1),16),m=v=>Math.round(v+(255-v)*f);return 'rgb('+m(n>>16)+','+m(n>>8&255)+','+m(n&255)+')'}
function gr3(x,a,b,c,cx,cy,r){const g=x.createRadialGradient(cx-r*.35,cy-r*.4,r*.08,cx,cy,r*1.15);g.addColorStop(0,c);g.addColorStop(.5,a);g.addColorStop(1,b);return g}
function el(x,cx,cy,rx,ry,f){x.fillStyle=f;x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,TAU);x.fill()}
function bl(x,p,cx,cy,rx,ry){el(x,cx,cy,rx,ry,gr3(x,p.a,p.b,p.c,cx,cy,Math.max(rx,ry)))}
function pg(x,pts,f){x.fillStyle=f;x.beginPath();pts.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.closePath();x.fill()}
function rr(x,X,Y,W,H,R,f){x.fillStyle=f;x.beginPath();x.moveTo(X+R,Y);x.arcTo(X+W,Y,X+W,Y+H,R);x.arcTo(X+W,Y+H,X,Y+H,R);x.arcTo(X,Y+H,X,Y,R);x.arcTo(X,Y,X+W,Y,R);x.closePath();x.fill()}
function eye(x,cx,cy,r,col){el(x,cx,cy,r,r*1.2,'#fff');el(x,cx+r*.12,cy+r*.15,r*.55,r*.7,col||K);el(x,cx-r*.1,cy-r*.25,r*.22,r*.22,'#fff')}
function eyes(x,x1,x2,y,r,col){eye(x,x1,y,r,col);eye(x,x2,y,r,col)}
function smile(x,cx,cy,w){x.strokeStyle=K;x.lineWidth=3.5;x.beginPath();x.arc(cx,cy-w*.4,w,.25*Math.PI,.75*Math.PI);x.stroke()}
function mir(x,fn){fn();x.save();x.translate(100,0);x.scale(-1,1);fn();x.restore()}
function shine(x,cx,cy,rx,ry){x.save();x.translate(cx,cy);x.rotate(-.6);el(x,0,0,rx,ry,'rgba(255,255,255,.5)');x.restore()}
function drop(x,cx,top,bot,w,f){const h=bot-top;x.fillStyle=f;x.beginPath();x.moveTo(cx,top);x.bezierCurveTo(cx+w*.9,top+h*.45,cx+w,bot-h*.25,cx+w*.85,bot-h*.2);x.bezierCurveTo(cx+w*.7,bot+h*.08,cx-w*.7,bot+h*.08,cx-w*.85,bot-h*.2);x.bezierCurveTo(cx-w,bot-h*.25,cx-w*.9,top+h*.45,cx,top);x.fill()}
const ART={
slime(x,p){ bl(x,p,50,62,40,31); eyes(x,37,63,60,8); smile(x,50,74,9); shine(x,30,42,11,6);
  if(p.crown){pg(x,[[30,36],[27,8],[40,22],[50,4],[60,22],[73,8],[70,36]],'#ffcf4a');rr(x,30,29,40,8,3,'#f0a81a');el(x,50,33,3.5,3.5,'#e5484d')} },
bat(x,p){ mir(x,()=>{x.fillStyle=p.b;x.beginPath();x.moveTo(46,46);x.quadraticCurveTo(22,10,3,38);x.quadraticCurveTo(14,40,16,56);x.quadraticCurveTo(26,46,32,64);x.quadraticCurveTo(38,54,46,66);x.closePath();x.fill();pg(x,[[34,40],[36,18],[48,36]],p.a)});
  bl(x,p,50,54,21,23); eyes(x,42,58,50,6.5); pg(x,[[44,64],[47,72],[50,64]],'#fff');pg(x,[[50,64],[53,72],[56,64]],'#fff'); shine(x,40,40,6,3) },
mush(x,p){ bl(x,P3('#f6e6c8','#d2bb92','#ffffff'),50,72,21,22); x.fillStyle=gr3(x,p.a,p.b,lt(p.a,.4),50,40,44);x.beginPath();x.ellipse(50,50,44,36,0,Math.PI,0);x.quadraticCurveTo(50,62,6,50);x.fill();
  el(x,30,34,7,6,'#fff');el(x,56,24,9,7,'#fff');el(x,76,40,6,5,'#fff'); eyes(x,42,58,72,5.5); smile(x,50,82,6) },
goblin(x,p){ bl(x,p,50,80,21,17); rr(x,31,80,38,14,6,p.r); mir(x,()=>{pg(x,[[24,48],[5,34],[24,36]],p.a);pg(x,[[33,24],[28,3],[44,17]],'#ffe9a8');el(x,24,78,8,11,p.a)});
  bl(x,p,50,44,30,27); eyes(x,38,62,44,7.5); x.strokeStyle=K;x.lineWidth=4;x.beginPath();x.moveTo(29,32);x.lineTo(44,37);x.moveTo(71,32);x.lineTo(56,37);x.stroke();
  rr(x,38,57,24,9,4,K); pg(x,[[40,57],[43,49],[46,57]],'#fff');pg(x,[[54,57],[57,49],[60,57]],'#fff'); shine(x,36,26,8,4) },
spider(x,p){ x.strokeStyle=p.b;x.lineWidth=5; mir(x,()=>{[[18,28,4,50],[14,44,2,70],[16,62,6,88],[26,74,20,94]].forEach(l=>{x.beginPath();x.moveTo(40,60);x.quadraticCurveTo(l[0],l[1],l[2],l[3]);x.stroke()})});
  bl(x,p,50,66,25,22); bl(x,p,50,42,19,17); eyes(x,42,58,40,6); el(x,34,48,3,3,'#fff');el(x,66,48,3,3,'#fff'); pg(x,[[45,54],[47,61],[49,54]],'#fff');pg(x,[[51,54],[53,61],[55,54]],'#fff') },
ghost(x,p){ x.fillStyle=gr3(x,p.a,p.b,p.c,50,46,48);x.beginPath();x.moveTo(18,90);x.lineTo(18,46);x.bezierCurveTo(18,0,82,0,82,46);x.lineTo(82,90);x.quadraticCurveTo(74,76,66,90);x.quadraticCurveTo(58,76,50,90);x.quadraticCurveTo(42,76,34,90);x.quadraticCurveTo(26,76,18,90);x.fill();
  el(x,38,44,6,9,K);el(x,62,44,6,9,K);el(x,36,40,2,2.5,'#fff');el(x,60,40,2,2.5,'#fff');el(x,50,64,6,8,K); shine(x,32,22,9,5) },
golem(x,p){ rr(x,29,78,17,20,6,p.b);rr(x,54,78,17,20,6,p.b); mir(x,()=>bl(x,p,14,62,11,21));
  rr(x,23,38,54,46,14,gr3(x,p.a,p.b,p.c,50,60,38)); rr(x,31,8,38,34,11,gr3(x,p.a,p.b,p.c,50,24,26));
  el(x,42,25,5,5,p.r);el(x,58,25,5,5,p.r);el(x,42,25,2,2,'#fff');el(x,58,25,2,2,'#fff'); rr(x,42,33,16,4,2,K);
  x.strokeStyle=p.b;x.lineWidth=2.5;x.beginPath();x.moveTo(34,50);x.lineTo(44,58);x.lineTo(40,68);x.moveTo(66,46);x.lineTo(60,56);x.stroke() },

const OPS={sum:['Sumas','+'],res:['Restas','−'],mul:['Multiplicaciones','×'],div:['Divisiones','÷']};
const TLV={sum:['Números de una cifra','Dos cifras más una cifra','Dos cifras más dos cifras','Tres cifras más dos cifras','Tres cifras más tres cifras'],
  res:['Números hasta el 18','Dos cifras menos una cifra','Dos cifras menos dos cifras','Tres cifras menos dos cifras','Tres cifras menos tres cifras'],
  mul:['Tablas del 1, 2, 5 y 10','Tablas del 3 y 4','Tablas del 6 y 8','Tablas del 7 y 9','Dos cifras por una cifra'],
  div:['Entre 2, 5 y 10','Entre 3 y 4','Entre 6 y 8','Entre 7 y 9','Números grandes entre una cifra']};

let tr={op:'sum',l:0};
function genT(op,l){ let q,a,b; const R=(lo,hi)=>lo+rnd(hi-lo+1);
  if(op==='sum'||op==='res'){ const s=op==='sum';
    if(l===0){ if(s){a=R(2,9);b=R(2,9)} else {a=R(6,18);b=R(2,Math.min(9,a-1))} }
    else if(l===1){ a=s?R(12,88):R(21,98); b=R(2,9) }
    else if(l===2)q=genQ(op);
    else if(l===3){ a=s?R(110,880):R(120,990); b=R(11,99) }
    else if(s){a=R(110,520);b=R(110,470)} else {a=R(400,990);b=R(110,a-60)}

      q={html:txt+' = '+HOLE,solved:txt+' = '+ans,ans,vals:four(ans,shuffle([ans+10,ans-10].concat(l>=3?[ans+100,ans-100]:[])).concat(shuffle([ans+1,ans-1,ans+2,ans-2]))),
        hint:l<2?(s?'Cuenta '+b+' más desde '+a+'.':'Cuenta '+b+' hacia atrás desde '+a+'.'):(s?'Suma por partes: centenas, luego decenas y luego unidades.':'Resta por partes: centenas, luego decenas y luego unidades.')} } }
  else if(op==='mul'){ if(l<4)q=genQ('mix',[[1,2,5,10],[3,4],[6,8],[7,9]][l]);
    else { a=R(12,49);b=R(2,9); const ans=a*b,D=Math.floor(a/10)*10,U=a%10;
      q={html:a+' × '+b+' = '+HOLE,solved:a+' × '+b+' = '+ans,ans,vals:four(ans,shuffle([ans+b,ans-b,ans+10,ans-10,ans+2*b])),hint:U?'Separa: '+D+' × '+b+' = '+D*b+' y '+U+' × '+b+' = '+U*b+'. Súmalos.':D/10+' × '+b+' = '+D/10*b+'. Ponle un 0 detrás.'} } }
  else { if(l<4)q=genQ('div',[[2,5,10],[3,4],[6,8],[7,9]][l]);
    else { b=R(2,9); const c=R(11,25),p=b*c; q={html:p+' ÷ '+b+' = '+HOLE,solved:p+' ÷ '+b+' = '+c,ans:c,vals:four(c,shuffle([c+1,c-1,c+10,c-10,c+2])),hint:b+' × 10 = '+b*10+'. Quedan '+(p-b*10)+' por repartir entre '+b+'.'} } }
  q.sm=0; q.sec=tsec(op,l); return q }

function bossDialog(b){ const d=MON['b'+b.i]; modal(d.n,'<div class="item"><i data-im="m:b'+b.i+'"></i><div class="t">Guardián de '+ZNAME[b.i]+'<small>Ataca con '+d.d+'. Nivel recomendado: '+d.lv+'. Tú tienes el nivel '+S.lvl+'.</small></div></div><div class="brow"><button class="btn" data-act="fight" data-b="'+b.i+'">Luchar</button><button class="btn alt" data-act="close">Ahora no</button></div>'); fillCanvases() }
function openShop(){ const row=i=>{const own=S.own[i.id],can=S.coins>=i.c; return '<div class="item">'+(i.k==='p'?'<i data-im="p:'+i.id+'"></i>':'')+'<div class="t">'+i.n+'<small>'+i.d+'</small></div>'+
    (own?(i.k==='p'?'<button class="btn alt" data-act="pet" data-id="'+i.id+'">'+(S.pet===i.id?'Contigo':'Llevar')+'</button>':'<b>Tuyo</b>'):'<button class="btn" data-act="buy" data-id="'+i.id+'"'+(can?'':' disabled')+'>'+i.c+' monedas</button>')+'</div>'};
  modal('Dojo','<p>Tienes <b>'+S.coins+'</b> monedas.</p><h3>Katanas</h3>'+ITEMS.filter(i=>i.k==='w').map(row).join('')+'<h3>Armaduras</h3>'+ITEMS.filter(i=>i.k==='a').map(row).join('')+'<h3>Compañeros</h3>'+ITEMS.filter(i=>i.k==='p').map(row).join('')); fillCanvases() }
let lock=null;
const LOCKQ=[['vp','red'],['red','vp','dob'],['falta','t3','t6'],['div','mix']];
function openChest(i){ if(i<0)return; if(S.chest[i]){toast('Este cofre ya está vacío.');return} const z=zoneOf(CHESTS[i][0],CHESTS[i][1]); lock={i,z,n:0,q:null,tries:0}; lockAsk() }
function lockAsk(){ const q=lock.q=genQ(pick(LOCKQ[lock.z])); lock.tries=0;
  modal('Cofre cerrado','<p style="text-align:center">Acierta 3 seguidas para abrir los cerrojos. Aquí no hay prisa.</p><div class="locks">'+[0,1,2].map(k=>k<lock.n?'🔓':'🔒').join(' ')+'</div><div class="cq">'+q.html+'</div><div id="lhint" style="text-align:center;color:var(--gold);font-weight:600;min-height:1.4em"></div><div class="answers">'+q.vals.map(v=>'<button data-act="lock" data-v="'+v+'">'+v+'</button>').join('')+'</div>') }
function lockAnswer(btn){ const q=lock.q; if(+btn.dataset.v===q.ans){ if(lock.tries===0){lock.n++;S.stats.ok++; if(q.fact)bump(q.fact,true)} sfx.hit();
    if(lock.n>=3){ const coins=30+20*lock.z,xp=10+8*lock.z; S.chest[lock.i]=1; S.coins+=coins; S.xp+=xp; let up=0; while(S.xp>=need(S.lvl)){S.xp-=need(S.lvl);S.lvl++;up++} if(up)S.hp=maxHP(); save(); sfx.open();
      modal('¡Cofre abierto!','<p style="text-align:center;font-size:1.3rem">+'+coins+' monedas · +'+xp+' de experiencia'+(up?'<br>¡Subes al nivel '+S.lvl+'!':'')+'</p><div class="brow"><button class="btn" data-act="close">Genial</button></div>'); lock=null }
    else lockAsk();
  } else { btn.classList.add('no'); sfx.bad(); if(lock.tries===0){S.stats.ko++; if(q.fact)bump(q.fact,false)} lock.tries++; lock.n=0; $('lhint').textContent=lock.tries>=2?'La respuesta es '+q.ans+'.':q.hint; $('mBody').querySelector('.locks').textContent='🔒 🔒 🔒' } }
let tab='heroe';
function openMenu(t){ tab=t||tab; const tabs='<div class="tabs">'+[['heroe','Héroe'],['bestiario','Bestiario'],['padres','Padres (mantén pulsado)']].map(x=>'<button data-act="tab" data-t="'+x[0]+'" aria-pressed="'+(tab===x[0])+'">'+x[1]+'</button>').join('')+'</div>'; let h='';
  if(tab==='heroe'){ h='<div class="kv"><div><b>'+S.lvl+'</b>nivel · cinturón '+belt()[0]+'</div><div><b>'+S.hp+' / '+maxHP()+'</b>vida</div><div><b>'+atk()+'</b>ataque</div><div><b>'+S.coins+'</b>monedas</div><div><b>'+S.boss.filter(Boolean).length+' / 4</b>cristales</div><div><b>'+Object.keys(S.chest).length+' / 12</b>cofres</div></div>'+
    '<h3>Tu aspecto</h3><div class="looks">'+LOOKS.map((l,i)=>'<button data-act="look" data-i="'+i+'" aria-pressed="'+(S.look===i)+'" aria-label="Aspecto '+(i+1)+'"><i data-im="h:'+i+'"></i></button>').join('')+'</div>'+
    '<p style="color:var(--muted)">Toca el mapa para caminar. Toca un monstruo, un cofre o el dojo para ir hasta ellos. Las hogueras curan y guardan la partida.</p>' }
  else if(tab==='bestiario'){ const ids=Object.keys(MON), got=ids.filter(k=>S.best[k]).length;
    h='<p>Has vencido a <b>'+got+' de '+ids.length+'</b> criaturas distintas.</p><div class="grid">'+ids.map(k=>{const m=MON[k],n=S.best[k]||0; return '<div class="mon"><i data-im="m:'+k+':'+(n?'n':'d')+'"></i><b>'+(n?m.n:'???')+'</b><small>'+(n?'Ataca con '+m.d+'<br>Vencido '+n+(n===1?' vez':' veces'):ZNAME[m.z])+'</small></div>'}).join('')+'</div>' }
  else h=parentsHTML();
  modal('Mochila',tabs+h); fillCanvases() }
function parentsHTML(){ const st=S.stats,tot=st.ok+st.ko,mast=Object.values(S.facts).filter(f=>f.b>=3).length; let wk=0;const now=new Date();
  for(let k=0;k<7;k++){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-k);wk+=st.days[d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')]||0}
  const NM=['sin practicar','le cuesta','aprendiendo','aprendiendo','dominada']; let t='<tr><th>×</th>'; for(let b=1;b<=10;b++)t+='<th>'+b+'</th>'; t+='</tr>';
  for(let a=1;a<=10;a++){t+='<tr><th>'+a+'</th>'; for(let b=1;b<=10;b++){const f=S.facts[fk(a,b)],c=!f?'':f.b>=3?'h3':f.b>=1?'h2':'h1'; t+='<td class="'+c+'" aria-label="'+a+' × '+b+', '+(f?NM[f.b+1]:NM[0])+'">'+a*b+'</td>'} t+='</tr>'}
  const hard=Object.entries(S.facts).filter(e=>e[1].ko>0&&e[1].b<3).sort((x,y)=>x[1].b-y[1].b||y[1].ko-x[1].ko).slice(0,6).map(e=>{const p=e[0].split('x');return p[0]+' × '+p[1]+' ('+e[1].ko+(e[1].ko===1?' fallo)':' fallos)')});
  return '<div class="kv"><div><b>'+st.battles+'</b>combates ganados</div><div><b>'+(tot?Math.round(100*st.ok/tot)+' %':'—')+'</b>aciertos a la primera</div><div><b>'+mast+' / 55</b>multiplicaciones dominadas</div><div><b>'+Math.round((st.days[today()]||0)/60)+' min</b>hoy</div><div><b>'+Math.round(wk/60)+' min</b>últimos 7 días</div></div>'+
   '<h3>Mapa de las tablas</h3><p style="color:var(--muted);font-family:system-ui,sans-serif;font-size:.9rem">Verde (✓): acertada a la primera tres veces en al menos dos días. Amarillo: aprendiendo. Rojo (!): le cuesta.</p><div class="scroll"><table class="heat">'+t+'</table></div>'+
   (hard.length?'<p style="font-family:system-ui,sans-serif"><b>Las que más falla:</b> '+hard.join(', ')+'</p>':'')+
   '<div class="sw"><span>Tiempo límite en los combates</span><button class="btn alt" data-act="set" data-k="timer">'+(S.set.timer?'Sí':'No')+'</button></div><div class="sw"><span>Sonido</span><button class="btn alt" data-act="set" data-k="sound">'+(S.set.sound?'Sí':'No')+'</button></div>'+
   '<p style="color:var(--muted);font-family:system-ui,sans-serif;font-size:.9rem">'+(saveOK?'La partida se guarda en el navegador de este dispositivo.':'Este navegador no deja guardar la partida.')+'</p>'+
   '<div class="sw"><span>Borrar la partida y empezar de cero</span><button class="btn alt" data-act="reset">Borrar</button></div><div id="rAsk" hidden class="sw"><span>¿Seguro? Se pierde todo.</span><button class="btn" data-act="reset2">Sí, borrar</button></div>' }
let holdT=null;
$('mBody').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-t="padres"]'); if(b){clearTimeout(holdT);holdT=setTimeout(()=>openMenu('padres'),1200)}});
['pointerup','pointercancel','pointerleave'].forEach(ev=>$('mBody').addEventListener(ev,()=>clearTimeout(holdT)));
$('mBody').addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b)return; const a=b.dataset.act;
  if(a==='close')closeModal();
  else if(a==='fight'){const i=+b.dataset.b; $('modal').hidden=true; state='world'; startBattle(null,BOSS[i])}
  else if(a==='buy'){const it=ITEMS.find(i=>i.id===b.dataset.id); if(it&&S.coins>=it.c&&!S.own[it.id]){S.coins-=it.c;S.own[it.id]=1; if(it.k==='p')S.pet=it.id; if(it.k==='a')S.hp=maxHP(); save();sfx.coin();openShop();hud()}}
  else if(a==='pet'){S.pet=S.pet===b.dataset.id?'':b.dataset.id;save();openShop()}
  else if(a==='lock'){ if(lock)lockAnswer(b) }
  else if(a==='top'){tr.op=b.dataset.k;openTrain()}
  else if(a==='tgo')startTrain(+b.dataset.l)
  else if(a==='tab'){ if(b.dataset.t!=='padres')openMenu(b.dataset.t); else if(e.detail===0)openMenu('padres') }
  else if(a==='look'){S.look=+b.dataset.i;save();openMenu('heroe')}
  else if(a==='set'){S.set[b.dataset.k]=!S.set[b.dataset.k];save();openMenu('padres')}
  else if(a==='reset')$('rAsk').hidden=false;
  else if(a==='reset2'){const keep=S.set;S=fresh();S.set=keep;S.intro=1;save();HERO.x=HERO.fx=S.x;HERO.y=HERO.fy=S.y;HERO.t=1;curZone=0;ENEMIES.forEach(e=>{e.alive=true;e.x=e.fx=e.hx;e.y=e.fy=e.hy});closeModal()} });
$('mClose').onclick=closeModal;
$('menuBtn').onclick=()=>{ if(state==='world')openMenu('heroe') };
$('trainHud').onclick=()=>{ if(state==='world')openTrain() };
$('trainBtn').onclick=()=>{ setState('world'); hud(); openTrain() };
$('answers').addEventListener('click',e=>{const b=e.target.closest('button'); if(b)answer(b)});
$('bCont').onclick=endBattle; $('flee').onclick=flee;

/* ================= controles ================= */
let finger=null;
function goTo(cx,cy){ const r=cv.getBoundingClientRect(),tx=Math.floor((cx-r.left)/ts+camx),ty=Math.floor((cy-r.top)/ts+camy);
  if(tx===HERO.x&&ty===HERO.y)return; const p=pathTo(tx,ty); HERO.held=-1;
  if(p)HERO.path=p; else { const dx=tx-HERO.x,dy=ty-HERO.y; HERO.path=[Math.abs(dx)>=Math.abs(dy)?(dx>0?1:3):(dy>0?2:0)] } }
cv.addEventListener('pointerdown',e=>{ if(state!=='world')return; finger={x:e.clientX,y:e.clientY,t:performance.now()}; goTo(e.clientX,e.clientY) });
cv.addEventListener('pointermove',e=>{ if(finger){finger.x=e.clientX;finger.y=e.clientY} });
['pointerup','pointercancel','pointerleave'].forEach(ev=>cv.addEventListener(ev,()=>{finger=null}));
setInterval(()=>{ if(finger&&state==='world'&&performance.now()-finger.t>250&&HERO.path.length<2)goTo(finger.x,finger.y); if(state!=='world')finger=null },160);
document.querySelectorAll('#dpad button').forEach(b=>{ b.addEventListener('pointerdown',e=>{e.preventDefault();HERO.path=[];HERO.held=+b.dataset.d}); ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{HERO.held=-1})) });
const KEYS={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3};
window.addEventListener('keydown',e=>{ if(state==='world'&&KEYS[e.key]!=null){e.preventDefault();HERO.path=[];HERO.held=KEYS[e.key]} else if(state==='battle'&&B&&!B.done&&e.key>='1'&&e.key<='4'){const b=$('answers').children[+e.key-1]; if(b)answer(b)} });
window.addEventListener('keyup',e=>{ if(KEYS[e.key]===HERO.held)HERO.held=-1 });
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{last=performance.now(); if(document.hidden)save()});
$('playBtn').onclick=()=>{ setState('world'); hud(); banner(ZNAME[curZone]);
  if(!S.intro){ S.intro=1; save(); modal('Bienvenido a Arkania','<p>Eres aprendiz de ninja y empiezas con el cinturón blanco. Los monstruos atacan con cuentas. Cada uno usa un tipo distinto: elige a cuál te enfrentas.</p><p>Si aciertas, golpeas. Si aciertas rápido, el golpe es <b>crítico</b>. Si encadenas aciertos, haces <b>combo</b> y pegas más fuerte.</p><p>Toca el mapa para caminar, o deja el dedo puesto y el ninja te sigue. La flecha amarilla lleva al primer guardián.</p><div class="brow"><button class="btn" data-act="close">Empezar</button></div>') } };

/* ================= arranque ================= */
genWorld(); buildTiles();
if(!walk(S.x,S.y)){S.x=START[0];S.y=START[1]} HERO.x=HERO.fx=S.x; HERO.y=HERO.fy=S.y; curZone=zoneOf(S.x,S.y); S.hp=Math.min(Math.max(1,S.hp),maxHP());
if(S.intro)$('playBtn').textContent='Continuar aventura';
resize(); setState('title'); last=performance.now(); requestAnimationFrame(frame);
})();
</script>
